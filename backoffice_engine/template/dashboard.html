{% extends 'header_footer.html' %}
{% load static %}
{% block content %}

<!-- Bootstrap & Icons -->
<div class="container mt-5">
  <h2 class="text-center mb-5">Dashboard</h2>
  <div class="row justify-content-center text-center">

    <!-- Users Icon with Badge -->
    <div class="col-md-4 mb-4">
      <div class="card shadow text-center p-4">
        <div class="position-relative d-inline-block">
          <i class="bi bi-person-circle fs-1 text-primary"></i>
          <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">
            {{ total_users }}
          </span>
        </div>
        <h5 class="mt-3">Users</h5>
      </div>
    </div>

    <!-- Subscribed Users Icon with Badge -->
    <div class="col-md-4 mb-4">
      <div class="card shadow text-center p-4">
        <div class="position-relative d-inline-block">
          <i class="bi bi-person-check-fill fs-1 text-success"></i>
          <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">
            {{ subscribed_users }}
          </span>
        </div>
        <h5 class="mt-3">Subscribed Users</h5>
      </div>
    </div>

    <!-- Feedback Icon with Badge -->
    <div class="col-md-4 mb-4">
      <div class="card shadow text-center p-4">
        <div class="position-relative d-inline-block">
          <i class="bi bi-chat-dots-fill fs-1 text-warning"></i>
          <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">
            {{ total_feedbacks }}
          </span>
        </div>
        <h5 class="mt-3">Feedback</h5>
      </div>
    </div>

    <!-- Interview Evaluated Icon with Badge -->
    <div class="col-md-4 mb-4">
      <div class="card shadow text-center p-4">
        <div class="position-relative d-inline-block">
          <i class="bi bi-patch-question-fill fs-1 text-primary"></i>
          <span class="badge bg-success position-absolute top-0 start-100 translate-middle rounded-pill">
            {{ interviews }}
          </span>
        </div>
        <h5 class="mt-3">Interviews Evaluated</h5>
      </div>
    </div>

    <!-- New Users This Week Icon with Badge -->
    <div class="col-md-4 mb-4">
      <div class="card shadow text-center p-4">
        <div class="position-relative d-inline-block">
          <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
          <span class="badge bg-success position-absolute top-0 start-100 translate-middle rounded-pill">
            {{ new_users_this_week }}
          </span>
        </div>
        <h5 class="mt-3">New Users This Week</h5>
      </div>
    </div>

  </div>
</div>

<!-- Bootstrap JS (optional for icons + animations) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% endblock %}
