{% extends 'header_footer.html' %}
{% load static %}
{% block content %}

  <main class="main">
    <section class="section py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card p-4 shadow">
              <h2 class="mb-4 text-center">Edit Profile</h2>
              <form method="POST" action="">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="name" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                  <label for="phone" class="form-label">Phone Number</label>
                  <input type="text" class="form-control" id="phone" name="phone" value="{{ user.phone }}" required>
                </div>
                <div class="mb-3">
                  <label for="address" class="form-label">Address</label>
                  <textarea class="form-control" id="address" name="address" rows="2" required>{{ user.address }}</textarea>
                </div>
                <div class="mb-3">
                  <label for="location" class="form-label">Location</label>
                  <input type="text" class="form-control" id="location" name="location" value="{{ user.location }}" required>
                </div>
                <div class="mb-3">
                  <label for="dob" class="form-label">Date of Birth</label>
                  <input type="date" class="form-control" id="dob" name="dob" value="{{ user.dob|date:'Y-m-d' }}" required>
                </div>
                <div class="text-end">
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                  <a href="/profile/" class="btn btn-secondary">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

{% endblock %}
